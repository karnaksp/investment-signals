<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal Cockpit</title>
  <style>
    :root {
      --bg: #08090b;
      --bg-soft: #0d0f12;
      --surface: #111418;
      --surface-2: #151a20;
      --surface-3: #1a2027;
      --border: #252c35;
      --border-strong: #35404b;
      --text: #e7edf3;
      --text-soft: #b8c2cc;
      --muted: #7e8995;
      --faint: #515b66;
      --accent: #35c2a4;
      --accent-2: #52a8ff;
      --positive: #49d17d;
      --negative: #f06b6b;
      --warning: #f5b84b;
      --info: #6ab8ff;
      --suppressed: #a779ff;
      --delivered: #35c2a4;
      --unknown: #7e8995;
      --shadow: 0 16px 50px rgba(0, 0, 0, 0.28);
      --r: 8px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --mono: "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 var(--font);
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }
    button {
      min-height: 32px;
      border: 1px solid var(--border-strong);
      border-radius: var(--r);
      background: var(--surface-2);
      color: var(--text);
      padding: 0 0.8rem;
      cursor: pointer;
    }
    button:hover { background: var(--surface-3); }
    button.primary {
      border-color: rgba(53, 194, 164, 0.45);
      background: rgba(53, 194, 164, 0.16);
      color: #d7fff5;
    }
    button.icon {
      width: 32px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-family: var(--mono);
    }

    input, select, textarea {
      min-height: 32px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: #090b0e;
      color: var(--text);
      padding: 0 0.65rem;
      outline: none;
    }
    textarea {
      min-height: 84px;
      padding: 0.65rem;
      resize: vertical;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(53, 194, 164, 0.65);
      box-shadow: 0 0 0 2px rgba(53, 194, 164, 0.12);
    }

    a { color: var(--accent-2); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 2px; }
    code, pre { font-family: var(--mono); }
    code {
      color: #c8d3df;
      background: #090b0e;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.1rem 0.32rem;
      font-size: 0.9em;
    }

    .boot {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--muted);
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 228px minmax(0, 1fr);
    }
    .side {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1rem 0.8rem;
      background: var(--bg-soft);
      border-right: 1px solid var(--border);
    }
    .brand {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 0.75rem;
      align-items: center;
      padding: 0.25rem 0.35rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: var(--r);
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(53, 194, 164, 0.22), rgba(82, 168, 255, 0.12));
      border: 1px solid rgba(53, 194, 164, 0.4);
      color: #d7fff5;
      font: 700 0.8rem var(--mono);
    }
    .brand-title { font-weight: 700; letter-spacing: 0; }
    .brand-sub { color: var(--muted); font-size: 0.72rem; margin-top: 1px; }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .nav a {
      display: grid;
      grid-template-columns: 22px 1fr;
      align-items: center;
      gap: 0.55rem;
      min-height: 34px;
      padding: 0 0.62rem;
      color: var(--text-soft);
      border: 1px solid transparent;
      border-radius: var(--r);
      text-decoration: none;
    }
    .nav a:hover { background: var(--surface); color: var(--text); }
    .nav a.active {
      background: var(--surface-2);
      border-color: var(--border-strong);
      color: var(--text);
    }
    .nav .glyph {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.74rem;
    }

    .side-footer {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding-top: 0.8rem;
      display: grid;
      gap: 0.5rem;
    }
    .side-footer label {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .main {
      min-width: 0;
      padding: 0 1.25rem 1.5rem;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      min-height: 58px;
      display: flex;
      gap: 0.8rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      background: linear-gradient(180deg, var(--bg) 82%, rgba(8, 9, 11, 0));
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--positive);
      box-shadow: 0 0 0 4px rgba(73, 209, 125, 0.12);
    }
    .status-text { color: var(--text-soft); }
    .status-text strong { color: var(--text); font-weight: 650; }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-soft);
      user-select: none;
    }
    .toggle input { min-height: auto; }

    .view {
      min-width: 0;
      display: grid;
      gap: 1rem;
    }
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.25rem 0 0.35rem;
      border-bottom: 1px solid var(--border);
    }
    .page-head h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.1;
      letter-spacing: 0;
    }
    .page-head p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      max-width: 72ch;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
    }
    .metric {
      min-width: 0;
      padding: 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
    }
    .metric .label {
      color: var(--muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .metric .value {
      margin-top: 0.35rem;
      font: 650 1.45rem/1 var(--mono);
      color: var(--text);
    }
    .metric .hint {
      margin-top: 0.32rem;
      color: var(--faint);
      font-size: 0.76rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.65fr);
      gap: 0.85rem;
      align-items: start;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.85rem;
    }
    .panel {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
    }
    .panel-head {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.015);
    }
    .panel-head h2 {
      margin: 0;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-soft);
    }
    .panel-body { padding: 0.85rem; }

    .filters {
      display: grid;
      grid-template-columns: repeat(7, minmax(110px, 1fr));
      gap: 0.55rem;
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .filters label {
      display: grid;
      gap: 0.25rem;
      color: var(--muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .table-wrap { overflow: auto; max-width: 100%; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.79rem;
    }
    th, td {
      padding: 0.56rem 0.7rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      text-align: left;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #0b0d10;
      color: var(--muted);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    tr:hover td { background: rgba(255, 255, 255, 0.025); }
    td.num, th.num {
      text-align: right;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .clip {
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.025);
      color: var(--text-soft);
      font-size: 0.72rem;
      white-space: nowrap;
    }
    .b-delivered { color: #bcffef; border-color: rgba(53, 194, 164, 0.38); background: rgba(53, 194, 164, 0.12); }
    .b-suppressed { color: #decfff; border-color: rgba(167, 121, 255, 0.38); background: rgba(167, 121, 255, 0.12); }
    .b-unknown { color: var(--text-soft); }
    .b-high { color: #cbffdc; border-color: rgba(73, 209, 125, 0.35); background: rgba(73, 209, 125, 0.1); }
    .b-medium { color: #ffe3ad; border-color: rgba(245, 184, 75, 0.35); background: rgba(245, 184, 75, 0.1); }
    .b-low { color: #ffc6c6; border-color: rgba(240, 107, 107, 0.35); background: rgba(240, 107, 107, 0.1); }
    .b-sev3 { color: #ffc6c6; }
    .b-sev2 { color: #ffe3ad; }

    .bar {
      display: grid;
      gap: 0.38rem;
    }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(92px, 1fr) 3fr 54px;
      gap: 0.6rem;
      align-items: center;
      color: var(--text-soft);
    }
    .bar-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #08090b;
      border: 1px solid var(--border);
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .empty, .error {
      padding: 1rem;
      color: var(--muted);
      border: 1px dashed var(--border-strong);
      border-radius: var(--r);
      background: rgba(255, 255, 255, 0.015);
    }
    .error {
      color: #ffd3d3;
      border-color: rgba(240, 107, 107, 0.38);
      background: rgba(240, 107, 107, 0.08);
    }
    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .muted { color: var(--muted); }
    .stack { display: grid; gap: 0.65rem; }
    .row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .split {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .pager {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.75rem;
      border-top: 1px solid var(--border);
    }
    pre.json {
      max-height: 520px;
      overflow: auto;
      margin: 0;
      padding: 0.85rem;
      background: #07080a;
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: #c9d4df;
      font-size: 0.74rem;
      line-height: 1.5;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, 0.45fr);
      gap: 0.85rem;
      align-items: start;
    }
    .summary-text {
      white-space: pre-wrap;
      color: var(--text-soft);
      padding: 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: #090b0e;
    }
    .fact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.55rem;
    }
    .fact {
      min-width: 0;
      padding: 0.65rem;
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: #090b0e;
    }
    .fact .label {
      color: var(--muted);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .fact .value {
      margin-top: 0.25rem;
      color: var(--text);
      font-family: var(--mono);
      overflow-wrap: anywhere;
    }

    @media (max-width: 1100px) {
      .shell { grid-template-columns: 1fr; }
      .side {
        position: relative;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .nav {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 0.2rem;
      }
      .nav a { min-width: max-content; }
      .side-footer { margin-top: 0; }
      .main { padding: 0 0.75rem 1rem; }
      .metrics, .grid-3, .fact-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-2, .detail-grid { grid-template-columns: 1fr; }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .metrics, .grid-3, .fact-grid, .filters { grid-template-columns: 1fr; }
      .page-head { align-items: flex-start; flex-direction: column; }
      .clip { max-width: 190px; }
    }
  </style>
</head>
<body>
  <div id="app" class="boot">Loading Signal Cockpit...</div>
  <script src="/admin/admin_app.js"></script>
</body>
</html>
