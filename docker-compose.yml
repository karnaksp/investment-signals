# ============================================================================
# Локальный стек: Redpanda (+ Schema Registry), Postgres, ClickHouse (архив raw),
# Prometheus/Grafana, сбор рыночных данных, детектор, API, пересчёт порогов.
#
# Переменные окружения — из файла .env в корне проекта (порты, токены и т.д.).
# Конфиги детектора и списка инструментов монтируются из ./conf (см. volumes).
#
# Полезные команды:
#   docker compose up -d --build
#   docker compose logs -f detector ingestor
#   Dagster (UI + daemon, расписания порогов и unary single-shot): http://localhost:${HOST_DAGSTER_PORT:-30300}
#   Постоянный unary-цикл (альтернатива расписанию Dagster):
#   docker compose --profile unary up -d market-unary-emitter
#   Старый бесконечный tinvest-threshold-cron без Dagster:
#   docker compose --profile legacy-threshold-cron up -d threshold-cron
#
# API (админка): без пересборки образа правки в ./src/tinvest_signal_engine
# подхватываются за счёт volume + TINVEST_API_RELOAD (uvicorn --reload).
# ============================================================================

services:
  # Kafka-совместимый брокер; лимиты диска см. redpanda-init (сырьё коротко, сигналы дольше).
  # Память: --memory — куча Seastar; mmap сегментов логов живёт вне неё → нужен mem_limit > --memory (см. .env.example).
  redpanda:
    image: ${REDPANDA_IMAGE:-redpandadata/redpanda:v24.3.6}
    mem_limit: "${REDPANDA_CONTAINER_MEM_LIMIT:-2560m}"
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "${REDPANDA_SEASTAR_MEMORY:-1G}"
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --set
      - redpanda.auto_create_topics_enabled=false
      # Меньше «залипания» кэшей чтения/фетча при малом RAM (см. cluster properties в доке Redpanda).
      - --set
      - redpanda.release_cache_on_segment_roll=true
      - --set
      - redpanda.readers_cache_target_max_size=${REDPANDA_READERS_CACHE_TARGET_MAX_SIZE:-32}
      - --set
      - redpanda.kafka_memory_share_for_fetch=${REDPANDA_KAFKA_MEMORY_SHARE_FOR_FETCH:-0.35}
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:${HOST_KAFKA_PORT:-39092}
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:${HOST_KAFKA_PORT:-39092}
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://redpanda:8082
      - --schema-registry-addr
      - PLAINTEXT://0.0.0.0:8081
    ports:
      - "${HOST_KAFKA_PORT:-39092}:${HOST_KAFKA_PORT:-39092}"
      - "${HOST_REDPANDA_METRICS_PORT:-39644}:9644"
      - "${HOST_SCHEMA_REGISTRY_PORT:-18081}:8081"
    volumes:
      - ./redpanda:/var/lib/redpanda/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rpk -X brokers=127.0.0.1:9092 cluster info >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # При каждом up: создаёт топики и выставляет retention (сырые события — коротко; сигналы — дольше).
  redpanda-init:
    image: ${REDPANDA_IMAGE:-redpandadata/redpanda:v24.3.6}
    depends_on:
      - redpanda
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for i in $(seq 1 60); do
          if rpk -X brokers=redpanda:9092 cluster info >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        rpk -X brokers=redpanda:9092 topic create marketdata.raw -p 1 -r 1 || true
        rpk -X brokers=redpanda:9092 topic create marketdata.raw.unary -p 1 -r 1 || true
        rpk -X brokers=redpanda:9092 topic create marketdata.signals -p 1 -r 1 || true
        rpk -X brokers=redpanda:9092 topic alter-config marketdata.raw \
          --set retention.ms=${KAFKA_RAW_RETENTION_MS:-21600000} \
          --set retention.bytes=${KAFKA_RAW_RETENTION_BYTES:-33554432} \
          --set segment.bytes=8388608
        rpk -X brokers=redpanda:9092 topic alter-config marketdata.raw.unary \
          --set retention.ms=${KAFKA_RAW_UNARY_RETENTION_MS:-21600000} \
          --set retention.bytes=${KAFKA_RAW_UNARY_RETENTION_BYTES:-16777216} \
          --set segment.bytes=8388608
        rpk -X brokers=redpanda:9092 topic alter-config marketdata.signals \
          --set retention.ms=${KAFKA_SIGNAL_RETENTION_MS:-2592000000} \
          --set retention.bytes=${KAFKA_SIGNAL_RETENTION_BYTES:-268435456} \
          --set segment.bytes=16777216
        # Дублируем «лёгкие» для RAM настройки без рестарта (на случай уже существующего кластера в volume).
        rpk -X brokers=redpanda:9092 -X admin.hosts=redpanda:9644 cluster config set release_cache_on_segment_roll true
        rpk -X brokers=redpanda:9092 -X admin.hosts=redpanda:9644 cluster config set readers_cache_target_max_size ${REDPANDA_READERS_CACHE_TARGET_MAX_SIZE:-32}

  # Веб-консоль для просмотра топиков и сообщений (опционально).
  redpanda-console:
    profiles: ["diagnostics"]
    image: ${REDPANDA_CONSOLE_IMAGE:-redpandadata/console:v2.8.4}
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "${HOST_REDPANDA_CONSOLE_PORT:-38080}:8080"

  # Хранилище сигналов и состояние для API.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    ports:
      - "${HOST_POSTGRES_PORT:-35432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-signal_engine}
      POSTGRES_USER: ${POSTGRES_USERNAME:-signal_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signal_engine}
    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ./sql/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Поток T-Invest → Kafka (сырые события); читает conf/instruments.yaml.
  ingestor:
    build:
      context: .
    depends_on:
      redpanda:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PROTO_DIR: /app/proto
    volumes:
      - ./conf:/app/conf:ro
    command: ["tinvest-raw-stream"]
    restart: unless-stopped

  # Kafka → детектор → Postgres + Kafka (сигналы); читает detectors.yaml и overrides.
  detector:
    build:
      context: .
    depends_on:
      redpanda:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      METRICS_LISTEN_PORT: "${METRICS_LISTEN_PORT:-9108}"
      PROTO_DIR: /app/proto
      DETECTOR_HEALTH_SNAPSHOT_PATH: /app/var/runtime-health/detector.json
    volumes:
      - ./conf:/app/conf:ro
      - ./var/runtime-health:/app/var/runtime-health
      # Тот же пакет, что в образе — правки в ./src без пересборки detector.
      - ./src/tinvest_signal_engine:/usr/local/lib/python3.12/site-packages/tinvest_signal_engine:ro
    command: ["tinvest-detector"]
    restart: unless-stopped
    expose:
      - "9108"

  # Метрики из JSON выхода duckdb_label_signals (mount ./var/accuracy).
  accuracy-metrics:
    build:
      context: .
    env_file:
      - .env
    environment:
      SIGNAL_ACCURACY_JSON_PATH: /data/signal_accuracy.json
      ACCURACY_METRICS_PORT: "9110"
    volumes:
      - ./var/accuracy:/data
    command: ["tinvest-accuracy-metrics"]
    restart: unless-stopped
    expose:
      - "9110"
    ports:
      - "${HOST_ACCURACY_METRICS_PORT:-39110}:9110"

  # Устаревший режим: бесконечный цикл вместо Dagster. По умолчанию не поднимается.
  threshold-cron:
    profiles: ["legacy-threshold-cron"]
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./conf:/app/conf
    command: ["tinvest-threshold-cron"]
    restart: unless-stopped

  # Dagster: расписания пересчёта порогов и unary single-shot → те же entrypoints, что compose.
  dagster-webserver:
    # UI нужен только для ручной диагностики. Расписания продолжает выполнять
    # dagster-daemon, поэтому постоянный web-процесс не расходует память.
    profiles: ["orchestration-ui"]
    build:
      context: .
      args:
        APP_EXTRAS: orchestration,replay
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PROTO_DIR: /app/proto
      MARKET_UNARY_POLL_SECONDS: "${MARKET_UNARY_POLL_SECONDS:-300}"
    volumes:
      - dagster_home:/opt/dagster/dagster_home
      - ./conf:/app/conf
    command:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3000"
      - -m
      - tinvest_signal_engine.orchestration_defs
    ports:
      - "${HOST_DAGSTER_PORT:-30300}:3000"
    restart: unless-stopped

  dagster-daemon:
    build:
      context: .
      args:
        APP_EXTRAS: orchestration,replay
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PROTO_DIR: /app/proto
      MARKET_UNARY_POLL_SECONDS: "${MARKET_UNARY_POLL_SECONDS:-300}"
      ADAPTIVE_CALIBRATION_STATE_DIR: /var/lib/investment-signals/adaptive-calibration
    volumes:
      - dagster_home:/opt/dagster/dagster_home
      - ./conf:/app/conf
      - ./var/adaptive-calibration:/var/lib/investment-signals/adaptive-calibration
    command:
      - dagster-daemon
      - run
      - -m
      - tinvest_signal_engine.orchestration_defs
    restart: unless-stopped

  # Unary GetMarketValues / GetTechAnalysis → тот же raw-топик (детектор их игнорирует).
  market-unary-emitter:
    profiles: ["unary"]
    build:
      context: .
    depends_on:
      redpanda:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PROTO_DIR: /app/proto
      MARKET_UNARY_POLL_SECONDS: "${MARKET_UNARY_POLL_SECONDS:-300}"
      MARKET_UNARY_METRICS_LISTEN_PORT: "${MARKET_UNARY_METRICS_LISTEN_PORT:-9109}"
    volumes:
      - ./conf:/app/conf:ro
    command: ["tinvest-market-unary-emitter"]
    restart: unless-stopped
    expose:
      - "9109"

  # OLAP: сырой поток из Redpanda через Kafka Engine (см. sql/clickhouse/init).
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8}
    depends_on:
      redpanda:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Пароль пользователя default при первом создании данных (см. .env).
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    ports:
      - "${HOST_CLICKHOUSE_HTTP_PORT:-38123}:8123"
      - "${HOST_CLICKHOUSE_NATIVE_PORT:-39000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8123/ping 2>/dev/null | grep -q Ok || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

  clickhouse-init:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8}
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./sql/clickhouse/init:/init:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        CH_USER="$${CLICKHOUSE_USERNAME:-default}"
        CH_PASS="$${CLICKHOUSE_PASSWORD:-}"
        CH_AUTH=()
        if [ -n "$$CH_PASS" ]; then
          CH_AUTH=(--user "$$CH_USER" --password "$$CH_PASS")
        fi
        for i in $$(seq 1 90); do
          if clickhouse-client --host clickhouse "$${CH_AUTH[@]}" -q 'SELECT 1' >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        for sql in /init/*.sql; do
          echo "Applying $${sql}..."
          clickhouse-client --host clickhouse "$${CH_AUTH[@]}" --multiquery < "$${sql}"
        done
        echo 'ClickHouse init done'

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.0}
    depends_on:
      - redpanda
      - detector
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${HOST_PROMETHEUS_PORT:-39090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.2.0}
    depends_on:
      - prometheus
    ports:
      - "${HOST_GRAFANA_PORT:-33000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    ports:
      - "${HOST_REDIS_PORT:-36379}:6379"
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # HTTP API поверх Postgres (история сигналов).
  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Внутри сети compose (перекрывает localhost из .env для CH и JSON точности).
      CLICKHOUSE_HTTP_URL: http://clickhouse:8123
      SIGNAL_ACCURACY_JSON_PATH: /app/var/accuracy/signal_accuracy.json
      DETECTOR_HEALTH_SNAPSHOT_PATH: /app/var/runtime-health/detector.json
      # Горячая перезагрузка Python при изменении смонтированного пакета.
      TINVEST_API_RELOAD: "1"
    volumes:
      - ./conf:/app/conf:ro
      - ./var/accuracy:/app/var/accuracy:ro
      - ./var/runtime-health:/app/var/runtime-health:ro
      # Код и статика админки с хоста → без docker compose build после правок UI.
      - ./src/tinvest_signal_engine:/usr/local/lib/python3.12/site-packages/tinvest_signal_engine:ro
    command: ["tinvest-api"]
    ports:
      - "${HOST_API_PORT:-38000}:8000"
    restart: unless-stopped

volumes:
  clickhouse_data:
  grafana_data:
  redis_data:
  dagster_home:
