name: Publish docs

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install docs dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build docs
        run: python -m mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure Pages site exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status="$(
            curl -sS -o /tmp/pages-get.json -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/pages"
          )"
          if [ "${status}" = "200" ]; then
            exit 0
          fi
          if [ "${status}" != "404" ]; then
            cat /tmp/pages-get.json
            exit 1
          fi
          create_status="$(
            curl -sS -o /tmp/pages-create.json -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/pages" \
              -d '{"build_type":"workflow"}'
          )"
          if [ "${create_status}" != "201" ] && [ "${create_status}" != "409" ]; then
            cat /tmp/pages-create.json
            exit 1
          fi

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
