name: Tagged release

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          with open("uv.lock", "rb") as source:
              packages = tomllib.load(source)["package"]
          lock_version = next(
              package["version"]
              for package in packages
              if package["name"] == "tinvest-signal-engine"
          )
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"tag {os.environ['RELEASE_TAG']!r} does not match {expected!r}"
              )
          if lock_version != version:
              raise SystemExit(
                  f"uv.lock package version {lock_version!r} does not match {version!r}"
              )
          PY

      - name: Select release verification scope
        run: |
          python scripts/release_scope.py \
            --previous-release \
            --current-tag "$GITHUB_REF_NAME" \
            --head "$GITHUB_SHA" \
            --github-env "$GITHUB_ENV" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Sync T-Invest SDK
        run: python scripts/sync_invest_sdk.py

      - name: Install verification dependencies
        run: python -m pip install --upgrade build ".[dev,docs,backtest]"

      - name: Run scoped release gates
        run: |
          python scripts/release_scope.py --run-tests "$RELEASE_SCOPE"
          python scripts/check_architecture.py
          node --check src/tinvest_signal_engine/static/admin_app.js
          python -m mkdocs build --strict
          python -m build

      - name: Build and smoke production image
        if: env.RELEASE_DOCKER_REQUIRED == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker build \
            --build-arg APP_VERSION="${RELEASE_TAG#v}" \
            --build-arg APP_COMMIT_SHA="${RELEASE_SHA}" \
            --build-arg APP_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t tinvest-signal-engine:release .
          docker run --rm tinvest-signal-engine:release python -c \
            "from tinvest_signal_engine.runtime_info import runtime_fingerprint; print(runtime_fingerprint())"

      - name: Smoke lightweight package
        if: env.RELEASE_DOCKER_REQUIRED != 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m venv /tmp/tinvest-release-smoke
          /tmp/tinvest-release-smoke/bin/pip install --no-deps dist/*.whl
          /tmp/tinvest-release-smoke/bin/python - <<'PY'
          import importlib.metadata
          import os

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          actual = importlib.metadata.version("tinvest-signal-engine")
          if actual != expected:
              raise SystemExit(f"built package {actual!r} does not match {expected!r}")
          print(f"lightweight package smoke: {actual}")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          notes="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "Investment Signals Core ${RELEASE_TAG}" \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "Investment Signals Core ${RELEASE_TAG}" \
              --generate-notes
          fi
