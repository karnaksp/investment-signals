name: CI

"on":
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Select verification scope
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          python scripts/release_scope.py \
            --base "$base_sha" \
            --head "$GITHUB_SHA" \
            --github-env "$GITHUB_ENV" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Sync T-Invest SDK
        run: python scripts/sync_invest_sdk.py

      - name: Install dependencies
        run: python -m pip install -e ".[dev,docs,backtest]"

      - name: Run scope-specific tests
        run: python scripts/release_scope.py --run-tests "$RELEASE_SCOPE"

      - name: Check Clean Architecture boundaries
        run: python scripts/check_architecture.py

      - name: Check admin JavaScript syntax
        run: node --check src/tinvest_signal_engine/static/admin_app.js

      - name: Build docs
        run: python -m mkdocs build --strict

      - name: Build Docker image and smoke runtime
        if: env.RELEASE_DOCKER_REQUIRED == 'true'
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker build \
            --build-arg APP_COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg APP_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t tinvest-signal-engine:ci .
          docker run --rm tinvest-signal-engine:ci python -c "from tinvest_signal_engine.runtime_info import runtime_fingerprint; from tinvest_signal_engine.services.api import create_app; app = create_app(); print(app.title, runtime_fingerprint())"
