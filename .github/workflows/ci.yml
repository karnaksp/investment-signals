name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -e ".[dev,docs,backtest]"

      - name: Run pytest
        run: python -m pytest -q

      - name: Check admin JavaScript syntax
        run: node --check src/tinvest_signal_engine/static/admin_app.js

      - name: Build docs
        run: python -m mkdocs build
