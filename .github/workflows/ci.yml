name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Sync T-Invest SDK
        run: python scripts/sync_invest_sdk.py

      - name: Install dependencies
        run: python -m pip install -e ".[dev,docs,backtest]"

      - name: Run pytest
        run: python -m pytest -q

      - name: Check admin JavaScript syntax
        run: node --check src/tinvest_signal_engine/static/admin_app.js

      - name: Build docs
        run: python -m mkdocs build --strict

      - name: Build Docker image and smoke runtime
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker build \
            --build-arg APP_COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg APP_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t tinvest-signal-engine:ci .
          docker run --rm tinvest-signal-engine:ci python -c "from tinvest_signal_engine.runtime_info import runtime_fingerprint; from tinvest_signal_engine.services.api import create_app; app = create_app(); print(app.title, runtime_fingerprint())"
