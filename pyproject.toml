[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinvest-signal-engine"
version = "0.2.0"
description = "Realtime anomaly detection pipeline for T-Invest market data."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = [
  "data-engineering",
  "market-data",
  "kafka",
  "redpanda",
  "clickhouse",
  "postgres",
  "fastapi",
  "observability",
]
dependencies = [
  "cachetools",
  "deprecation",
  "fastapi",
  "grpcio>=1.59.3",
  "httpx",
  "kafka-python-ng",
  "lz4>=4.3",
  "orjson>=3.10",
  "prometheus-client>=0.20",
  "psycopg[binary]>=3.2",
  "protobuf>=5.29.6,<6",
  "python-dateutil",
  "pyyaml",
  "redis>=5.0.0",
  "uvicorn[standard]",
]

[project.scripts]
tinvest-raw-stream = "tinvest_signal_engine.services.ingestor:main"
tinvest-detector = "tinvest_signal_engine.services.detector_service:main"
tinvest-api = "tinvest_signal_engine.services.api:main"
tinvest-local-notifier = "tinvest_signal_engine.services.local_notifier:main"
tinvest-threshold-cron = "tinvest_signal_engine.services.threshold_cron:main"
tinvest-accuracy-metrics = "tinvest_signal_engine.services.accuracy_metrics:main"
tinvest-market-unary-emitter = "tinvest_signal_engine.services.market_unary_emitter:main"
tinvest-migrate = "tinvest_signal_engine.services.migrate:main"
tinvest-delivery-worker = "tinvest_signal_engine.services.delivery_worker:main"
tinvest-observation-worker = "tinvest_signal_engine.services.observation_worker:main"
tinvest-scientific-candle-writer = "tinvest_signal_engine.services.scientific_candle_writer:main"
tinvest-signal-outcome-worker = "tinvest_signal_engine.services.signal_outcome_worker:main"
tinvest-bond-convergence-emitter = "tinvest_signal_engine.services.bond_convergence_emitter:main"
tinvest-cache-candles = "tinvest_signal_engine.services.candle_cache:main"
tinvest-import-scientific-history = "tinvest_signal_engine.services.historical_candle_import:main"
tinvest-morning-retracement-worker = "tinvest_signal_engine.services.morning_retracement_signal_worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinvest_signal_engine = ["static/**/*.html", "static/**/*.js", "static/vendor/**/*.js"]

[project.optional-dependencies]
orchestration = [
  "dagster>=1.8.0,<2",
  "dagster-webserver>=1.8.0,<2",
]
replay = [
  "duckdb==1.5.4",
  "pytz>=2024.1",
]
dev = [
  "pytest>=8",
  "playwright>=1.40",
  "dagster>=1.8.0,<2",
  "dagster-webserver>=1.8.0,<2",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]
backtest = [
  "clickhouse-connect>=0.7.0",
  "duckdb>=1.0.0",
]
research = [
  "duckdb>=1.0.0",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
]
proto = [
  "grpcio-tools>=1.62,<1.82",
]

[project.urls]
Documentation = "https://karnaksp.github.io/investment-signals/"
Repository = "https://github.com/karnaksp/investment-signals"
Issues = "https://github.com/karnaksp/investment-signals/issues"
