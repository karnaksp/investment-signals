  - hypothesis_id: h7-relative-volume-future-activity
    version: "1.0.0"
    title: Аномальный относительный объём и будущая активность
    origin: research_extension
    source_ids: [graczyk-queiros-2018]
    testable_statement: Объём 15-минутного окна выше 90-го процентиля нормы той же фазы предшествует повышенной изменчивости и числу сделок относительно контроля.
    economic_mechanism: Кластеризация поступления информации и участия трейдеров сохраняет повышенную рыночную активность после объёмной аномалии.
    market_phase: any_liquid_session_phase
    trigger_conditions: [relative_volume_15m_percentile >= 0.90]
    expected_direction: activity_increase
    horizon_seconds: [900, 1800, 3600]
    abstention_conditions: [fewer_than_20_prior_phase_observations, trading_gap, volume_unavailable]
    falsification_criterion: Изменчивость и число сделок после события не превосходят контроль с положительной нижней границей интервала.
    original_market_result: Исходное исследование показало устойчивую, но меняющуюся со временем внутридневную сезонность объёма.
    evidence_level: not_tested
    lifecycle: pre_registered
    scientific_claim: true
    preregistration:
      registration_id: prereg-h7-v1
      hypothesis_id: h7-relative-volume-future-activity
      hypothesis_version: "1.0.0"
      sealed_at: "2026-07-19T00:00:00+03:00"
      expected_direction: activity_increase
      feature_definitions: [relative volume compares the completed 15-minute window with prior trading days in the same phase only]
      thresholds: {relative_volume_percentile_min: 0.90, prior_phase_observations_min: 20, train_days_share: 0.60, tune_days_share: 0.20, holdout_days_share: 0.20}
