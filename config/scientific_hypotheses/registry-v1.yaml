    source_ids: [heston-korajczyk-sadka-2010]
    testable_statement: Направление средней доходности того же получасового интервала за 20 предыдущих торговых дней повторяется в текущем интервале чаще контрольной частоты.
    economic_mechanism: Периодическое исполнение институциональных заявок создаёт повторяющийся спрос на ликвидность в одной фазе торгового дня.
    market_phase: half_hour_bucket
