schema_version: "1.1.0"

# This registry records research leads. A publication is never, by itself,
# evidence that the effect works on MOEX. Applied hypotheses additionally need
# a sealed preregistration and independent, cost-adjusted MOEX evidence.
sources:
  - source_id: heston-korajczyk-sadka-2010
    title: Intraday Patterns in the Cross-section of Stock Returns
    authors: [Steven L. Heston, Robert A. Korajczyk, Ronnie Sadka]
    publication_year: 2010
    identifier: doi:10.1111/j.1540-6261.2010.01573.x
    url: https://arxiv.org/abs/1005.3535
    primary_publication: true
    market: United States, NYSE
    sample_period: 2001-01 through 2005-12 for the intraday TAQ sample
    sample_description: NYSE-listed common stocks matched to TAQ; half-hour intervals
    data_frequency: intraday trades and quotes aggregated to 30 minutes
    economic_mechanism: Periodic institutional trading and temporary liquidity imbalances can create continuation at daily multiples and reversal within an hour.
    limitations:
      - The source market, trading hours, and participant composition differ from MOEX.
      - The documented daily-multiple continuation is not evidence for a 1-30 minute MOEX forecast.
    original_result: Return continuation recurs at the same half-hour on subsequent days; sub-hour reversal is associated with temporary liquidity imbalance and bid-ask bounce.

  - source_id: jegadeesh-titman-1995
    title: Short-Horizon Return Reversals and the Bid-Ask Spread
    authors: [Narasimhan Jegadeesh, Sheridan Titman]
    publication_year: 1995
    identifier: doi:10.1006/jfin.1995.1006
    url: https://doi.org/10.1006/jfin.1995.1006
    primary_publication: true
    market: United States dealer market
    sample_period: Historical U.S. stock sample documented in the licensed publication
    sample_description: Individual stock returns measured at multiple short horizons
    data_frequency: short-horizon returns and quoted bid-ask spreads
    economic_mechanism: Dealer inventory pressure and bid-ask bounce introduce transitory price components and negative serial covariance.
    limitations:
      - MOEX is an electronic limit-order market rather than the dealer setting studied by the paper.
      - Bid-ask bounce must be separated from an economically tradable reversal after costs.
    original_result: A substantial part of measured short-horizon reversal is consistent with inventory-based microstructure effects.

  - source_id: butt-hogholm-sadaqat-2021
    title: "Reversal returns and expected returns from liquidity provision: Evidence from emerging markets"
    authors: [Hilal Anwar Butt, Kenneth Högholm, Mohsin Sadaqat]
    publication_year: 2021
    identifier: doi:10.1016/j.mulfin.2020.100664
    url: https://doi.org/10.1016/j.mulfin.2020.100664
    primary_publication: true
    market: 21 emerging equity markets
    sample_period: 1990-01 through 2017-06
    sample_description: Emerging-market stocks grouped by size, liquidity, volatility, and investor exits
    data_frequency: periodic stock returns and firm/market characteristics
    economic_mechanism: Liquidity suppliers are compensated for absorbing price pressure, especially during volatile markets and active investor exits.
    limitations:
      - Cross-market portfolio evidence does not identify a MOEX intraday entry rule.
      - Country, currency, survivorship, and transaction-cost differences require local reproduction.
    original_result: Short-term reversal returns are stronger for small, illiquid, volatile stocks and during high market volatility or investor exits.

  - source_id: chiang-kirby-nie-2021
    title: Short-term reversals, short-term momentum, and news-driven trading activity
    authors: [I-Hsuan Ethan Chiang, Chris Kirby, Ziye Zoe Nie]
    publication_year: 2021
    identifier: doi:10.1016/j.jbankfin.2021.106068
    url: https://doi.org/10.1016/j.jbankfin.2021.106068
    primary_publication: true
    market: United States equities
    sample_period: 1963-07 through 2018-12
    sample_description: CRSP common stocks sorted by prior return and monthly turnover, with news-related analyses
    data_frequency: monthly returns, turnover, liquidity, and announcement windows
    economic_mechanism: Liquidity-demand shocks tend to reverse, while information-driven high-turnover moves tend to continue.
    limitations:
      - Monthly turnover is only a research lead for an intraday relative-volume condition.
      - News and liquidity demand cannot be distinguished from candles alone without proxy validation.
    original_result: Reversal weakens as turnover rises; the highest-turnover stocks exhibit short-term momentum associated with news-driven activity.

  - source_id: graczyk-queiros-2018
    title: "Intraday Seasonalities and Nonstationarity of Trading Volume in Financial Markets: Individual and Cross-Sectional Features"
    authors: [Michelle B. Graczyk, Silvio M. D. Queirós]
    publication_year: 2018
    identifier: arxiv:1810.12099
    url: https://arxiv.org/abs/1810.12099
    primary_publication: true
    market: United States, Dow Jones Industrial Average constituents
    sample_period: 2003 through 2014
    sample_description: Blue-chip equities in the Dow Jones Industrial Average, evaluated in semester blocks
    data_frequency: intraday trading-volume moments and price-fluctuation volatility
    economic_mechanism: Information arrival and participant behaviour produce phase-specific volume distributions that change across market regimes.
    limitations:
      - Intraday seasonality is nonstationary and must be estimated without future observations.
      - U.S. blue-chip volume profiles cannot be copied directly to MOEX morning or evening sessions.
    original_result: The average U-shaped volume profile and higher moments changed materially over time; morning and afternoon exhibit different statistical dynamics.

  - source_id: gould-bonart-2015
    title: Queue Imbalance as a One-Tick-Ahead Price Predictor in a Limit Order Book
    authors: [Martin D. Gould, Julius Bonart]
    publication_year: 2015
    identifier: arxiv:1512.03492
    url: https://arxiv.org/abs/1512.03492
    primary_publication: true
    market: United States, Nasdaq
    sample_period: Historical sample documented in the publication
    sample_description: Ten liquid Nasdaq stocks separated into large-tick and small-tick groups
    data_frequency: event-level best bid and ask queues and subsequent mid-price moves
    economic_mechanism: A persistent imbalance between best bid and ask queues represents asymmetric near-term liquidity pressure.
    limitations:
      - The relation was stronger for large-tick stocks and cannot be copied to MOEX without local validation.
      - Queue imbalance predicts the next mid-price move, not an executable profit after latency and costs.
    original_result: Logistic and local-logistic models improved prediction of the next mid-price direction relative to an unconditional null model.

  - source_id: cont-kukanov-stoikov-2014
    title: The Price Impact of Order Book Events
    authors: [Rama Cont, Arseniy Kukanov, Sasha Stoikov]
    publication_year: 2014
    identifier: doi:10.1093/jjfinec/nbt003
    url: https://arxiv.org/abs/1011.6402
    primary_publication: true
    market: United States, NYSE
    sample_period: Historical NYSE TAQ sample documented in the publication
    sample_description: Fifty U.S. stocks with limit orders, market orders, cancellations, quotes, and trades
    data_frequency: event-level order-book events aggregated over short intervals
    economic_mechanism: Net supply and demand changes at the best quotes move prices, with impact inversely related to available depth.
    limitations:
      - Event ordering, latency, lot sizes, and session structure differ on MOEX.
      - Trade volume alone is a noisier proxy than synchronized order-flow imbalance.
    original_result: Short-interval price changes had a robust approximately linear relation with order-flow imbalance and an inverse relation with market depth.

  - source_id: berkman-koch-tuttle-zhang-2012
    title: "Paying Attention: Overnight Returns and the Hidden Cost of Buying at the Open"
    authors: [Henk Berkman, Paul D. Koch, Laura Tuttle, Ying Jenny Zhang]
    publication_year: 2012
    identifier: doi:10.1017/S0022109012000270
    url: https://doi.org/10.1017/S0022109012000270
    primary_publication: true
    market: United States equities
    sample_period: Historical U.S. equity sample documented in the publication
    sample_description: Individual stocks grouped by investor attention, valuation uncertainty, arbitrage cost, and sentiment
    data_frequency: Overnight close-to-open and subsequent intraday returns
    economic_mechanism: Attention-driven buying near the open can create a temporary positive price pressure that is subsequently reversed during the trading day.
    limitations:
      - The source identifies an attention-related U.S. effect, not a ready-made MOEX opening rule.
      - MOEX pre-market trading, session boundaries, costs, and investor composition require a new local test.
    original_result: Positive overnight returns, especially in high-attention stocks, tended to reverse during the following trading day.

  - source_id: da-liu-schaumburg-2014
    title: A Closer Look at the Short-Term Return Reversal
    authors: [Zhi Da, Qianqiu Liu, Ernst Schaumburg]
    publication_year: 2014
    identifier: doi:10.1287/mnsc.2013.1766
    url: https://doi.org/10.1287/mnsc.2013.1766
    primary_publication: true
    market: United States equities
    sample_period: Historical U.S. equity sample documented in the publication
    sample_description: Individual-stock returns decomposed using cash-flow news proxies and market characteristics
    data_frequency: Short-horizon stock returns and analyst-information variables
    economic_mechanism: Return components unrelated to fundamental news are more likely to reflect temporary liquidity pressure or sentiment and therefore reverse.
    limitations:
      - Analyst revisions used in the source are not available in the local candle cache.
      - Removing only the market component is a weaker intraday proxy and must be described as a research extension.
    original_result: Residual return components unrelated to fundamental news exhibited stronger short-term reversal than standard past returns.

  - source_id: corsi-2009
    title: A Simple Approximate Long-Memory Model of Realized Volatility
    authors: [Fulvio Corsi]
    publication_year: 2009
    identifier: doi:10.1093/jjfinec/nbp001
    url: https://doi.org/10.1093/jjfinec/nbp001
    primary_publication: true
    market: Multiple liquid financial markets documented in the publication
    sample_period: Historical realized-volatility samples documented in the publication
    sample_description: Realized volatility represented by additive components over heterogeneous time horizons
    data_frequency: High-frequency returns aggregated to realized-volatility horizons
    economic_mechanism: Participants operating at different horizons create a persistent cascade of short-, medium-, and long-horizon volatility components.
    limitations:
      - The original model forecasts volatility rather than price direction.
      - Intraday MOEX windows, trading breaks, microstructure noise, and sparse instruments require a separately validated adaptation.
    original_result: A parsimonious heterogeneous autoregressive specification reproduced long-memory-like volatility dynamics and delivered strong forecasts.

  - source_id: darrat-rahman-zhong-2003
    title: "Intraday Trading Volume and Return Volatility of the DJIA Stocks: A Note"
    authors: [Ali F. Darrat, Shafiqur Rahman, Maosen Zhong]
    publication_year: 2003
    identifier: doi:10.1016/S0378-4266(02)00321-7
    url: https://doi.org/10.1016/S0378-4266(02)00321-7
    primary_publication: true
    market: United States, Dow Jones Industrial Average constituents
    sample_period: Historical five-minute DJIA sample documented in the publication
    sample_description: All thirty DJIA stocks with intraday volume and return-volatility measurements
    data_frequency: Five-minute trades, volume, and estimated return volatility
    economic_mechanism: Sequential information arrival can create lead-lag relations between unusual trading volume and subsequent volatility.
    limitations:
      - The source reported heterogeneous lead-lag effects and little contemporaneous relation for most stocks.
      - A MOEX activity warning must be allowed to fail by instrument and phase rather than assume a universal effect.
    original_result: Significant volume-volatility lead-lag relations appeared for many, but not all, DJIA stocks.

hypotheses:
  - hypothesis_id: h1-morning-low-volume-reversion
    version: "1.0.0"
    title: Возврат утреннего отклонения при слабом объёме
    origin: research_extension
    source_ids: [heston-korajczyk-sadka-2010, jegadeesh-titman-1995, butt-hogholm-sadaqat-2021, graczyk-queiros-2018]
    testable_statement: Если в 07:00–09:49 цена сильно отклонилась от предыдущего закрытия без подтверждения накопленным относительным объёмом, после 10:00 она частично возвращается к закрытию чаще сопоставимых контрольных событий.
    economic_mechanism: В малоликвидной фазе временный дисбаланс ликвидности может смещать цену; приход основной ликвидности поглощает давление.
    market_phase: morning_0700_0949
    trigger_conditions: [absolute_open_gap_z >= 2.0, cumulative_relative_volume <= 0.50]
    expected_direction: reversion_to_previous_close
    horizon_seconds: [1800, 3600]
    abstention_conditions: [missing_previous_close, trading_gap, cumulative_relative_volume_unavailable, market_wide_move_same_direction]
    falsification_criterion: Нижняя граница 95%-интервала прироста результата после издержек к контролю не выше нуля на независимых 20% торговых дней.
    original_market_result: На исходных рынках краткосрочный разворот связывается с временным давлением ликвидности; точная утренняя формула является локальным развитием.
    evidence_level: not_tested
    lifecycle: pre_registered
    scientific_claim: true
    preregistration:
      registration_id: prereg-h1-v1
      hypothesis_id: h1-morning-low-volume-reversion
      hypothesis_version: "1.0.0"
      sealed_at: "2026-07-19T00:00:00+03:00"
      expected_direction: reversion_to_previous_close
      feature_definitions: [absolute_open_gap_z uses only same-minute history from prior trading days, cumulative_relative_volume uses only volume observed by event time]
      thresholds: {absolute_open_gap_z_min: 2.0, cumulative_relative_volume_max: 0.50, train_days_share: 0.60, tune_days_share: 0.20, holdout_days_share: 0.20}
      market_phase: morning_0700_0949
      horizon_seconds: [1800, 3600]
      success_criterion: Cost-adjusted matched-control lift has 95% lower bound above zero, adjusted p<=0.05, and the sign is stable in at least 4 of 5 chronological blocks.
      abstention_conditions: [missing_previous_close, trading_gap, cumulative_relative_volume_unavailable, market_wide_move_same_direction]
      cost_model_version: "1.0.0"
      data_split_policy: 60/20/20 chronological trading days
      multiple_testing_policy: Benjamini-Hochberg within morning-regime family at q<=0.05

  - hypothesis_id: h2-morning-high-volume-continuation
    version: "1.0.0"
    title: Продолжение утреннего отклонения при подтверждающем объёме
    origin: research_extension
    source_ids: [chiang-kirby-nie-2021, graczyk-queiros-2018]
    testable_statement: Сильное утреннее отклонение, подтверждённое высоким относительным объёмом и широким диапазоном, чаще продолжается после 10:00, чем сопоставимые контрольные события.
    economic_mechanism: Высокая торговая активность повышает вероятность информационного, а не временного ликвидностного движения.
    market_phase: morning_0700_0949
    trigger_conditions: [absolute_open_gap_z >= 2.0, cumulative_relative_volume >= 1.50, range_percentile >= 0.90]
    expected_direction: continuation
    horizon_seconds: [900, 1800, 3600]
    abstention_conditions: [missing_previous_close, trading_gap, relative_volume_unavailable, range_norm_unavailable]
    falsification_criterion: Независимый эффект после издержек и контроля не положителен либо знак не сохраняется в четырёх из пяти блоков.
    original_market_result: В исходной работе высокая активность ослабляла разворот и была связана с продолжением; внутридневная формула является заранее заданным развитием.
    evidence_level: not_tested
    lifecycle: pre_registered
    scientific_claim: true
    preregistration:
      registration_id: prereg-h2-v1
      hypothesis_id: h2-morning-high-volume-continuation
      hypothesis_version: "1.0.0"
      sealed_at: "2026-07-19T00:00:00+03:00"
      expected_direction: continuation
      feature_definitions: [open_gap_z uses only prior-day same-minute norms, relative volume and range use observations no later than event time]
      thresholds: {absolute_open_gap_z_min: 2.0, cumulative_relative_volume_min: 1.50, range_percentile_min: 0.90, train_days_share: 0.60, tune_days_share: 0.20, holdout_days_share: 0.20}
      market_phase: morning_0700_0949
      horizon_seconds: [900, 1800, 3600]
      success_criterion: Cost-adjusted matched-control lift has 95% lower bound above zero, adjusted p<=0.05, and the sign is stable in at least 4 of 5 chronological blocks.
      abstention_conditions: [missing_previous_close, trading_gap, relative_volume_unavailable, range_norm_unavailable]
      cost_model_version: "1.0.0"
      data_split_policy: 60/20/20 chronological trading days
      multiple_testing_policy: Benjamini-Hochberg within morning-regime family at q<=0.05

  - hypothesis_id: h3-jump-low-activity-reversal
    version: "1.0.0"
    title: Разворот резкого движения при слабой активности
    origin: research_extension
    source_ids: [jegadeesh-titman-1995, butt-hogholm-sadaqat-2021, chiang-kirby-nie-2021]
    testable_statement: Пятиминутное движение выше собственного 99-го процентиля при относительном объёме ниже медианы и повышенной неликвидности чаще разворачивается, чем сопоставимые контрольные события.
    economic_mechanism: Слабая активность и высокая неликвидность соответствуют временному ценовому давлению, которое поглощают поставщики ликвидности.
    market_phase: main_session
    trigger_conditions: [absolute_return_5m_percentile >= 0.99, relative_volume_percentile < 0.50, illiquidity_percentile >= 0.75]
    expected_direction: reversal
    horizon_seconds: [300, 900, 1800]
    abstention_conditions: [market_wide_move_same_direction, relative_volume_above_median, trading_gap, missing_liquidity_proxy]
    falsification_criterion: Результат разворота после издержек не превосходит контроль на независимой части либо устойчивое продолжение сильнее разворота.
    original_market_result: Исследования связывают часть краткосрочного разворота с временным давлением ликвидности и инвентарным риском.
    evidence_level: not_tested
    lifecycle: pre_registered
    scientific_claim: true
    preregistration:
      registration_id: prereg-h3-v1
      hypothesis_id: h3-jump-low-activity-reversal
      hypothesis_version: "1.0.0"
      sealed_at: "2026-07-19T00:00:00+03:00"
      expected_direction: reversal
      feature_definitions: [rolling percentiles use prior trading days only, illiquidity is absolute return divided by contemporaneous turnover]
      thresholds: {return_5m_percentile_min: 0.99, relative_volume_percentile_max_exclusive: 0.50, illiquidity_percentile_min: 0.75, train_days_share: 0.60, tune_days_share: 0.20, holdout_days_share: 0.20}
      market_phase: main_session
      horizon_seconds: [300, 900, 1800]
      success_criterion: Cost-adjusted reversal lift to matched controls has 95% lower bound above zero and adjusted p<=0.05 with 4/5 block stability.
      abstention_conditions: [market_wide_move_same_direction, relative_volume_above_median, trading_gap, missing_liquidity_proxy]
      cost_model_version: "1.0.0"
      data_split_policy: 60/20/20 chronological trading days
      multiple_testing_policy: Benjamini-Hochberg within jump-regime family at q<=0.05

  - hypothesis_id: h4-jump-high-activity-continuation
    version: "1.0.0"
    title: Продолжение резкого движения при высокой активности
    origin: research_extension
    source_ids: [chiang-kirby-nie-2021]
    testable_statement: Пятиминутное движение выше собственного 99-го процентиля при относительном объёме и диапазоне выше 90-го процентиля чаще продолжается, чем сопоставимые контрольные события.
    economic_mechanism: Согласованные цена, объём и диапазон чаще отражают поступление информации, а не кратковременный недостаток ликвидности.
    market_phase: main_session
    trigger_conditions: [absolute_return_5m_percentile >= 0.99, relative_volume_percentile >= 0.90, range_percentile >= 0.90]
    expected_direction: continuation
    horizon_seconds: [300, 900, 1800]
    abstention_conditions: [trading_gap, relative_volume_unavailable, range_norm_unavailable]
    falsification_criterion: Продолжение после издержек не превосходит контроль либо разворот устойчиво сильнее на независимой части.
    original_market_result: Высокая торговая активность в исходном исследовании разделяла режим продолжения от режима краткосрочного разворота.
    evidence_level: not_tested
    lifecycle: pre_registered
    scientific_claim: true
    preregistration:
      registration_id: prereg-h4-v1
      hypothesis_id: h4-jump-high-activity-continuation
      hypothesis_version: "1.0.0"
      sealed_at: "2026-07-19T00:00:00+03:00"
      expected_direction: continuation
      feature_definitions: [rolling percentiles use prior trading days only, range and relative volume stop at event time]
      thresholds: {return_5m_percentile_min: 0.99, relative_volume_percentile_min: 0.90, range_percentile_min: 0.90, train_days_share: 0.60, tune_days_share: 0.20, holdout_days_share: 0.20}
      market_phase: main_session
      horizon_seconds: [300, 900, 1800]
      success_criterion: Cost-adjusted continuation lift to matched controls has 95% lower bound above zero and adjusted p<=0.05 with 4/5 block stability.
      abstention_conditions: [trading_gap, relative_volume_unavailable, range_norm_unavailable]
      cost_model_version: "1.0.0"
      data_split_policy: 60/20/20 chronological trading days
      multiple_testing_policy: Benjamini-Hochberg within jump-regime family at q<=0.05

  - hypothesis_id: h5-same-phase-return-recurrence
    version: "1.0.0"
    title: Повторяемость доходности в одной фазе дня
    origin: research_derived
    source_ids: [heston-korajczyk-sadka-2010]
    testable_statement: Направление средней доходности того же получасового интервала за 20 предыдущих торговых дней повторяется в текущем интервале чаще контрольной частоты.
    economic_mechanism: Периодическое исполнение институциональных заявок создаёт повторяющийся спрос на ликвидность в одной фазе торгового дня.
    market_phase: half_hour_bucket
    trigger_conditions: [same_bucket_20d_mean_return_bps != 0.0]
    expected_direction: same_as_prior_20d_bucket_mean
    horizon_seconds: [1800]
    abstention_conditions: [fewer_than_20_prior_trading_days, trading_gap, insufficient_bucket_coverage]
    falsification_criterion: Совпадение направления и результат после издержек не превосходят контроль на независимой части.
    original_market_result: На исходном рынке доходность повторялась в том же получасовом интервале в следующие торговые дни.
    evidence_level: not_tested
    lifecycle: pre_registered
    scientific_claim: true
    preregistration:
      registration_id: prereg-h5-v1
      hypothesis_id: h5-same-phase-return-recurrence
      hypothesis_version: "1.0.0"
      sealed_at: "2026-07-19T00:00:00+03:00"
      expected_direction: same_as_prior_20d_bucket_mean
      feature_definitions: [same-bucket mean uses exactly 20 completed prior trading days and never the current interval]
      thresholds: {lookback_trading_days: 20, mean_absolute_bps_min_exclusive: 0.0, train_days_share: 0.60, tune_days_share: 0.20, holdout_days_share: 0.20}
      market_phase: half_hour_bucket
      horizon_seconds: [1800]
      success_criterion: Cost-adjusted matched-control lift has 95% lower bound above zero and adjusted p<=0.05 with 4/5 block stability.
      abstention_conditions: [fewer_than_20_prior_trading_days, trading_gap, insufficient_bucket_coverage]
      cost_model_version: "1.0.0"
      data_split_policy: 60/20/20 chronological trading days
      multiple_testing_policy: Benjamini-Hochberg within intraday-recurrence family at q<=0.05

  - hypothesis_id: h6-open-close-market-continuation
    version: "1.0.0"
    title: Движение рынка в начале и перед закрытием основной сессии
    origin: research_extension
    source_ids: [heston-korajczyk-sadka-2010]
    testable_statement: Направление равновзвешенной корзины ликвидных TQBR-акций за первые 30 минут основной сессии повторяется в последние 30 минут чаще контрольной частоты.
    economic_mechanism: Длительное исполнение институционального потока может связывать спрос на ликвидность в начале и конце торгового дня.
    market_phase: main_open_to_preclose
    trigger_conditions: [basket_open_30m_absolute_bps >= 5.0, basket_coverage >= 0.80]
    expected_direction: same_as_opening_basket
