# Durable detector state for crash/replay recovery.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
aof-use-rdb-preamble yes

# Detector state must not be evicted under memory pressure. The platform layer
# supplies the container memory limit and alerts before Redis reaches it.
maxmemory-policy noeviction

save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
