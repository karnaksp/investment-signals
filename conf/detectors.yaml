# ============================================================================
# Детектор аномалий — главный файл настроек порогов и окон.
# Редактируйте на лету: сервис detector подхватывает изменения по интервалу
# CONFIG_RELOAD_INTERVAL_SECONDS из .env (проверка mtime файла).
#
# Структура:
#   detector: — глобальные параметры для всех инструментов
#   per_instrument: — опционально, переопределения по ключу TICKER_CLASS
#
# Ключ инструмента совпадает с форматом в conf/instruments.yaml: TICKER_CLASS
# (например SBER_TQBR, BRM6_SPBFUT).
#
# Авто-пороги из Dagster (threshold_recalc_job) или legacy threshold-cron — в detectors.overrides.yaml
# и мержятся поверх этого файла (см. DETECTORS_OVERRIDES_CONFIG в .env).
# ============================================================================

detector:
  # Как часто (сек) пересчитывать выборки при наличии событий в окне.
  # Реже — меньше корреляции между соседними точками истории и меньше «дребезга».
  sample_every_seconds: 15

  # Минимум точек в истории для расчёта z-score (иначе сигнал не считается).
  min_baseline_points: 24

  # Максимум точек в каждой скользящей истории (обрезка «хвоста»).
  baseline_points: 160

  # Окно для ленты сделок: объём, число сделок, дельта по направлению (сек).
  trade_window_seconds: 180

  # Окно для оценки движения цены по last_price/trade (сек).
  price_window_seconds: 180

  # Окно для спреда и имбаланса стакана (сек).
  orderbook_window_seconds: 180

  # Пауза между двумя алертами одного типа по инструменту (сек).
  alert_cooldown_seconds: 900
  # После любого алерта по инструменту — тишина по всем типам (сек). Главный анти-спам.
  alert_global_cooldown_seconds: 3600

  # Дополнительно к z-score: относительное отклонение метрики от baseline (доля).
  # При почти нулевом std z-score раздувается — этот порог отсекает «микроскопические» выбросы.
  min_relative_metric_excursion: 0.12

  # Расстояние mid до ближайшего limit_up/down (bps); 0 = выключено (см. поля стакана в стриме).
  limit_band_warning_bps: 0
  # Алерт при is_consistent=false в снимке стакана.
  signal_orderbook_inconsistent: false
  # z-score по потоку open_interest (фьючерсы); 0 = выключено.
  open_interest_zscore_threshold: 0
  # z-score по (high−low)/open в bps на закрытых свечах; 0 = выключено (нужны candles в instruments).
  candle_range_zscore_threshold: 0
  # Сигнал market_access_changed при смене limit_order_available / market_order_available.
  track_market_access_flags: true
  # Прикладывать к payload сигнала последние unary-снимки (Kafka: market_values / tech_analysis).
  attach_unary_context_to_signals: true

  # --- Исторические аномалии (baseline по минуте дня UTC в ClickHouse, см. sql/clickhouse/init/004*) ---
  # Долгая история: trade_slot_daily (TTL ~200 д) наполняется Dagster job из сырья за последние N дней
  # и при первом запуске — из features_trade_bar_*; см. .env HISTORICAL_BASELINE_*.
  # Пока job не отработал и детектор не подхватил кэш — оставьте false.
  historical_baseline_enabled: false
  historical_lookback_days: 35
  historical_min_sample_days: 10
  historical_compare_percentile: p95
  historical_exceed_multiplier: 1.0
  historical_primary_signals_enabled: true
  historical_alert_cooldown_seconds: 900
  historical_timeframes_csv: "1m,5m,15m"

  # Микроструктура: «вторичный» режим — умножает z-score пороги _maybe_emit_from_history и combo_min_score.
  microstructure_secondary_mode: false
  microstructure_secondary_threshold_multiplier: 1.5

  # --- Пороги z-score по типам сигналов ---
  # Чем выше — тем реже срабатывание (нужен более «редкий» выброс относительно базы).
  volume_zscore_threshold: 10
  trade_count_zscore_threshold: 10
  price_return_zscore_threshold: 8.0
  spread_zscore_threshold: 7.5
  imbalance_zscore_threshold: 7.5

  # Дополнительный порог по модулю имбаланса (0..1): ниже этого абсолютного
  # отклонения от 50/50 не считаем «аномальным» даже при высоком z-score.
  imbalance_absolute_threshold: 0.65

  # Минимальное движение цены в окне price_window (в базисных пунктах, bps).
  # 0 = фильтр выключен. Ненулевое значение можно задавать вручную или подставлять
  # из detectors.overrides.yaml (daily threshold-cron).
  price_move_absolute_threshold_bps: 0.0

  # --- Комбинированный сигнал «микроструктура» (long / short) ---
  # Включает совместную оценку: расширение спреда, имбаланс стакана,
  # всплеск частоты сделок, накопленная дельта по направлению сделок.
  combo_enabled: false

  # За сколько секунд «назад» считать компоненты combo актуальными (свежесть).
  combo_freshness_seconds: 45

  # Сумма баллов по компонентам должна быть >= этого числа для алерта combo.
  combo_min_score: 7

  # Отдельная пауза между алертами microstructure_combo_* (сек).
  combo_alert_cooldown_seconds: 180

  # Баллы за компоненты (настраивается «вес» каждого признака в итоговой сумме).
  combo_spread_points: 1
  combo_imbalance_points: 1
  combo_tick_rate_points: 2
  combo_delta_points: 2

  # Доля объёма bid от (bid+ask) на верхних уровнях: выше — «лонг», ниже — «шорт».
  combo_imbalance_long_threshold: 0.80
  combo_imbalance_short_threshold: 0.20

  # Минимальный |накопленная дельта по лотам| за trade_window, чтобы дать баллы за дельту.
  combo_delta_min_abs_qty: 1.0

  # --- Эвристика «спуфинг» верхних уровней (L2/L3 сумма по 3 уровням) ---
  # Ищет резкое исчезновение крупной стены на одной стороне при почти неподвижном mid.
  # По умолчанию выключено: включайте осознанно (много ложных срабатываний на тонких инструментах).
  # spoofing_enabled: false
  # spoofing_wall_ratio: 2.5          # bid_L3 / ask_L3 (или зеркально для ask)
  # spoofing_qty_drop_ratio: 0.55    # доля «схлопывания» стены между двумя снапшотами
  # spoofing_max_mid_move_bps: 3.0   # допустимое движение mid между снапшотами
  # spoofing_max_gap_seconds: 2.0    # максимум времени между снапшотами
  # spoofing_min_wall_qty: 500.0     # минимальный объём стены (лоты, сумма 3 уровней)
  # spoofing_lookback_seconds: 5.0   # хвост истории снапшотов

  # order_book_depth_levels: 5     # L2: сколько уровней суммировать для imbalance / OBI / spoofing
  # obi_dynamics_enabled: false
  # obi_delta_absolute_threshold: 0.12
  # obi_delta_zscore_threshold: 2.5
  # trade_burst_enabled: false
  # trade_burst_window_ms: 100
  # trade_burst_min_trades: 50
  # trade_burst_min_abs_qty: 5.0
  # lead_lag_enabled: false
  # lead_lag_window_seconds: 30
  # lead_lag_leader_move_bps: 8.0
  # lead_lag_follower_max_bps: 2.0

  # --- Order flow (VPIN, whale, absorption, iceberg) — шумные эвристики выключены ---
  vpin_enabled: false
  vpin_bucket_volume_lots: 5000
  vpin_lookback_buckets: 50
  vpin_zscore_threshold: 4.0
  vpin_min_buckets_before_emit: 20

  whale_print_enabled: true
  whale_print_zscore_threshold: 10.0
  whale_min_absolute_qty: 600

  absorption_enabled: false
  absorption_window_ms: 800
  absorption_min_aggressive_qty: 120
  absorption_max_mid_move_bps: 2.0
  absorption_aggression_ratio: 4.0

  iceberg_enabled: false
  iceberg_hit_window_ms: 2000
  iceberg_min_hit_qty: 80
  iceberg_min_refill_qty: 50
  iceberg_min_refill_ratio: 0.5
  iceberg_max_gap_seconds: 3.0
  iceberg_price_tolerance_bps: 1.0

  # Режим «узкий спред + перевес» — частый фоновый шум; выключен.
  spread_imbalance_regime_enabled: false
  regime_max_spread_bps: 8.0
  regime_min_imbalance_abs: 0.78
  regime_long_threshold: 0.80
  regime_short_threshold: 0.20
  regime_alert_cooldown_seconds: 900

# lead_lag:
#   pairs:
#     - leader: SBER_TQBR
#       follower: LKOH_TQBR

# -----------------------------------------------------------------------------
# Переопределения только для выбранных инструментов (ключ = TICKER_CLASS).
# Любое поле из секции detector выше можно переопределить точечно.
#
# Пример:
# per_instrument:
#   BRM6_SPBFUT:
#     volume_zscore_threshold: 5.5
#     combo_min_score: 7
# -----------------------------------------------------------------------------
